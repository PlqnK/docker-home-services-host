---
- name: 'Enable IP forward kernel parameters'
  ansible.posix.sysctl:
    name: '{{ item }}'
    value: 1
    sysctl_set: true
    reload: true
    state: 'present'
  loop:
    - 'net.ipv4.ip_forward'
    - 'net.ipv6.conf.all.forwarding'

- name: 'Template Wireguard comfiguration'
  ansible.builtin.template:
    src: 'wg0.conf.j2'
    dest: '/etc/wireguard/wg0.conf'
    owner: 'root'
    group: 'root'
    mode: '0600'

- name: 'Enable and start wireguard tunnel'
  ansible.builtin.systemd_service:
    name: 'wg-quick@wg0.service'
    enabled: true
    state: 'started'

- name: 'Accept Wireguard incomming connections in default firewalld zone'
  ansible.posix.firewalld:
    zone: 'public'
    service: 'wireguard'
    permanent: true
    immediate: true
    state: 'enabled'

- name: 'Create firewalld VPN zone'
  ansible.posix.firewalld:
    zone: 'vpn'
    permanent: true
    state: 'present'
  notify: 'Reload firewalld service'

- name: 'Reload firewalld if VPN zone has been created'
  ansible.builtin.meta: 'flush_handlers'

- name: 'Add wireguard interface to firewalld VPN zone'
  ansible.posix.firewalld:
    zone: 'vpn'
    interface: 'wg0'
    permanent: true
    immediate: true
    state: 'enabled'

- name: 'Enable firewalld VPN zone forwarding'
  ansible.posix.firewalld:
    zone: 'vpn'
    forward: true
    permanent: true
    immediate: true
    state: 'enabled'

- name: 'Enable firewalld public zone maquerading'
  ansible.posix.firewalld:
    zone: 'public'
    masquerade: true
    permanent: true
    immediate: true
    state: 'enabled'

- name: 'Add SSH service to firewalld VPN zone'
  ansible.posix.firewalld:
    zone: 'vpn'
    service: 'ssh'
    permanent: true
    immediate: true
    state: 'enabled'
